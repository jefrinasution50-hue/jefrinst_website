<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada ajakan untukmu</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe9ee;--bg2:#f6c9d6;--ink:#4a1630;--rose:#e0456f;--paper:#fffaf3;--line:#e9d5c4;--shadow:rgba(74,22,48,.25);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0b1c;--bg2:#4a1630;--ink:#ffe3ec;--rose:#ff6b98;--paper:#fff4e6;--line:#e9d5c4;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a0b1c;--bg2:#4a1630;--ink:#ffe3ec;--rose:#ff6b98;--paper:#fff4e6;--line:#e9d5c4;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:Fraunces,Georgia,serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.h{position:absolute;bottom:-40px;color:var(--rose);opacity:.35;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
main{width:min(92vw,460px);text-align:center;position:relative;z-index:1}
.hint{font-size:1.15rem;margin:0 0 1.2rem;font-style:italic}
/* amplop */
.env{position:relative;width:100%;aspect-ratio:3/2;margin:0 auto;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
.env .body{position:absolute;inset:0;background:#f4b6c8;border-radius:10px;box-shadow:0 18px 40px var(--shadow)}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#e98aa7;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s;z-index:3;border-radius:10px 10px 0 0}
.env .front{position:absolute;inset:0;background:linear-gradient(#f9c9d8,#f4b6c8);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:10px;z-index:2}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.4rem;z-index:4;transition:opacity .3s;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.18)}}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0;animation:none}
.env:focus-visible{outline:3px solid var(--rose);outline-offset:6px;border-radius:12px}
/* surat */
.letter{display:none;background:var(--paper);color:#4a1630;border-radius:6px;padding:1.6rem 1.4rem 1.4rem;box-shadow:0 20px 50px var(--shadow);background-image:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);text-align:left;animation:rise .7s ease-out}
@keyframes rise{from{transform:translateY(40px) scale(.96);opacity:0}}
.letter .to{font-family:Caveat,cursive;font-size:1.9rem;font-weight:700;margin:0 0 .2rem;line-height:34px}
.letter .msg{font-family:Caveat,cursive;font-size:1.5rem;line-height:34px;margin:0;min-height:170px;white-space:pre-wrap}
.letter .from{font-family:Caveat,cursive;font-size:1.6rem;text-align:right;margin:.4rem 0 0;line-height:34px;opacity:0;transition:opacity .8s}
.ask{display:none;margin-top:1.4rem}
.ask h2{font-size:1.7rem;margin:0 0 1rem;font-weight:500;font-style:italic}
.btns{display:flex;gap:.9rem;justify-content:center;align-items:center;min-height:56px}
button.b{font:inherit;font-size:1.1rem;padding:.75rem 1.6rem;border-radius:999px;border:2px solid var(--rose);cursor:pointer;transition:transform .15s}
.yes{background:var(--rose);color:#fff;font-weight:500}
.yes:hover{transform:scale(1.08)}
.no{background:transparent;color:var(--ink)}
.no.run{position:fixed;z-index:5}
.yes:focus-visible,.no:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* sukses */
.done{display:none;animation:rise .8s ease-out}
.done .big{font-size:4rem;margin:0;animation:beat2 1.2s infinite}
@keyframes beat2{50%{transform:scale(1.15)}}
.done h1{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:500;margin:.4rem 0 .6rem;font-style:italic}
.done p{font-size:1.15rem;margin:0}
/* edit */
.edit{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:6;font-size:.85rem;opacity:.5;background:none;border:1px solid currentColor;color:var(--ink);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-family:inherit}
.edit:hover,.edit:focus-visible{opacity:1}
dialog{border:0;border-radius:14px;padding:1.2rem;width:min(92vw,420px);background:var(--paper);color:#4a1630;font-family:Fraunces,Georgia,serif}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:.6rem 0 .2rem;font-size:.95rem}
dialog input,dialog textarea{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:#4a1630}
dialog textarea{min-height:130px;resize:vertical}
dialog .row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<main>
  <section id="s1">
    <p class="hint">Ada surat untukmu. Ketuk untuk membukanya.</p>
    <button class="env" id="env" aria-label="Buka surat">
      <div class="body"></div><div class="front"></div><div class="flap"></div><div class="seal">💌</div>
    </button>
  </section>
  <section id="s2" style="display:none">
    <div class="letter" id="letter">
      <p class="to" id="to"></p>
      <p class="msg" id="msg"></p>
      <p class="from" id="from"></p>
    </div>
    <div class="ask" id="ask">
      <h2 id="q">Mau jalan bareng aku akhir pekan ini?</h2>
      <div class="btns" id="btns">
        <button class="b yes" id="yes">Mau</button>
        <button class="b no" id="no">Tidak</button>
      </div>
    </div>
  </section>
  <section class="done" id="done">
    <p class="big">💖</p>
    <h1 id="doneT">Yeay, kita jalan ya!</h1>
    <p id="doneP">Nanti aku kabari lewat chat soal jam dan tempatnya. Sampai ketemu!</p>
  </section>
</main>

<button class="edit" id="editBtn">ubah isi surat</button>
<dialog id="dlg">
  <form method="dialog" id="f">
    <label for="iTo">Nama dia</label><input id="iTo">
    <label for="iFrom">Nama kamu</label><input id="iFrom">
    <label for="iMsg">Isi surat</label><textarea id="iMsg"></textarea>
    <label for="iQ">Pertanyaan</label><input id="iQ">
    <div class="row"><button class="b no" value="cancel" style="color:#4a1630">Batal</button><button class="b yes" value="ok" id="save">Simpan</button></div>
  </form>
</dialog>

<script>
var D={
  to:"Untuk Emaliya Sinaga,",
  from:"— yang lagi deg-degan nunggu jawabanmu",
  msg:"Halo, aku punya satu permintaan kecil.\n\nAkhir-akhir ini aku sering kepikiran, rasanya seru kalau bisa ngobrol lebih lama sama kamu, tanpa buru-buru dan tanpa gangguan.\n\nJadi, boleh nggak aku ajak kamu jalan? Cukup santai: cari tempat yang enak, makan sesuatu, ngobrol apa saja. Kamu yang pilih tempatnya, aku yang jemput.",
  q:"Mau jalan bareng aku akhir pekan ini?"
};
try{var saved=JSON.parse(localStorage.getItem("ajakan")||"null");if(saved)D=Object.assign(D,saved)}catch(e){}
var $=function(i){return document.getElementById(i)};
var typing=null;

/* hati melayang */
var HE=["💗","💕","❤️","💖"];
setInterval(function(){
  var h=document.createElement("span");h.className="h";h.textContent=HE[Math.random()*HE.length|0];
  h.style.left=Math.random()*100+"%";h.style.fontSize=(14+Math.random()*22)+"px";
  h.style.animationDuration=(6+Math.random()*6)+"s";
  $("hearts").appendChild(h);setTimeout(function(){h.remove()},12500);
},600);

function render(){
  $("to").textContent=D.to;$("from").textContent=D.from;$("q").textContent=D.q;
}
render();

function type(text,cb){
  var el=$("msg"),i=0;el.textContent="";
  clearInterval(typing);
  typing=setInterval(function(){
    el.textContent=text.slice(0,++i);
    if(i>=text.length){clearInterval(typing);cb()}
  },45);
}

function openEnv(){
  $("env").classList.add("open");
  setTimeout(function(){
    $("s1").style.display="none";$("s2").style.display="block";
    $("letter").style.display="block";
    type(D.msg,function(){
      $("from").style.opacity=1;
      setTimeout(function(){$("ask").style.display="block"},600);
    });
  },800);
}
$("env").addEventListener("click",openEnv,{once:true});

/* tombol "Tidak" yang kabur */
var tries=0,labels=["Tidak","Yakin?","Coba pikir lagi","Sekali lagi?","Please...","Jangan gitu dong"];
function dodge(e){
  if(e)e.preventDefault();
  var b=$("no");tries++;
  b.textContent=labels[Math.min(tries,labels.length-1)];
  b.classList.add("run");
  var w=b.offsetWidth,h=b.offsetHeight;
  b.style.left=Math.max(8,Math.random()*(innerWidth-w-16))+"px";
  b.style.top=Math.max(8,Math.random()*(innerHeight-h-16))+"px";
  var y=$("yes");y.style.fontSize=(1.1+tries*.12)+"rem";
}
$("no").addEventListener("mouseenter",dodge);
$("no").addEventListener("touchstart",dodge,{passive:false});
$("no").addEventListener("click",dodge);

/* jawaban ya */
$("yes").addEventListener("click",function(){
  $("s2").style.display="none";$("no").style.display="none";$("done").style.display="block";
  for(var i=0;i<60;i++)setTimeout(burst,i*60);
});
function burst(){
  var h=document.createElement("span");h.className="h";h.textContent=HE[Math.random()*HE.length|0];
  h.style.left=Math.random()*100+"%";h.style.fontSize=(20+Math.random()*30)+"px";h.style.opacity=.9;
  h.style.animationDuration=(3+Math.random()*3)+"s";
  $("hearts").appendChild(h);setTimeout(function(){h.remove()},6500);
}

/* ubah isi */
$("editBtn").addEventListener("click",function(){
  $("iTo").value=D.to;$("iFrom").value=D.from;$("iMsg").value=D.msg;$("iQ").value=D.q;
  $("dlg").showModal();
});
$("f").addEventListener("submit",function(e){
  if(e.submitter&&e.submitter.value==="ok"){
    D={to:$("iTo").value,from:$("iFrom").value,msg:$("iMsg").value,q:$("iQ").value};
    try{localStorage.setItem("ajakan",JSON.stringify(D))}catch(x){}
    render();
  }
});
</script>
</body>
</html>
